rootProject.name = 'AlpakkaWeaver'

def specsJavaLibsRoot = System.getenv('SPECS_JAVA_LIBS_HOME') ?: '../../specs-java-libs'
def laraFrameworkRoot = System.getenv('LARA_FRAMEWORK_HOME') ?: '../../lara-framework'

includeBuild("${specsJavaLibsRoot}/SpecsUtils")
includeBuild("${specsJavaLibsRoot}/jOptions")

includeBuild("${laraFrameworkRoot}/LangSpec2")
includeBuild("${laraFrameworkRoot}/LaraUtils")
includeBuild("${laraFrameworkRoot}/WeaverGen2")
includeBuild("${laraFrameworkRoot}/LARAI")
includeBuild("${laraFrameworkRoot}/WeaverInterface")

includeBuild("../AlpakkaParser")
includeBuild("../AlpakkaAst")
