plugins {
    id 'distribution'
    id 'application' // Executable
    id 'java' // Java project
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Repositories providers
repositories {
    mavenCentral()
    google() // smali
}

configurations {
    weaverGeneratorRuntime
}

// Project sources
sourceSets {
    // Spec source set: compiled independently to avoid circular dependency
    spec {
        java {
            srcDir 'src-spec'
        }
    }
    main {
        java {
            srcDir 'src'
        }

        resources {
            srcDir 'resources'
        }
    }
}

dependencies {
    implementation ":SpecsUtils"
    implementation ":jOptions"
    
    implementation ":LARAI"
    implementation ":LaraUtils"
    implementation ":WeaverInterface"
    implementation ":LangSpec2"

    implementation ":AlpakkaParser"
    implementation ":AlpakkaAst"

    weaverGeneratorRuntime ":WeaverGen2"

    // Spec source set: only needs LangSpec2 and WeaverInterface (for BaseJoinPointSpec)
    specImplementation ":LangSpec2"
    specImplementation ":WeaverInterface"
}


// Generate weaver abstracts using WeaverGen2 (Java DSL-based)
tasks.register('generateWeaver', JavaExec) {
    group = "Execution"
    description = "Generates the Weaver Abstracts using WeaverGen2"
    classpath = configurations.weaverGeneratorRuntime + sourceSets.spec.runtimeClasspath
    mainClass = 'org.lara.weavergen2.cli.WeaverGen2Cli'
    args = [
        "pt.up.fe.specs.alpakka.weaver.SmaliSpec",
        "${projectDir}/src",
        "--base", "org.lara.interpreter.weaver.interf.BaseJoinPointSpec",
        "--node", "pt.up.fe.specs.alpakka.ast.SmaliNode"
    ]
}

compileJava.dependsOn generateWeaver

def alpakkaWeaverInstallDir = layout.buildDirectory.dir('install/AlpakkaWeaver')
def alpakkaJsJavaBinaries = layout.projectDirectory.dir('../Alpakka-JS/java-binaries')

def syncAlpakkaJsJavaBinaries = tasks.register('syncAlpakkaJsJavaBinaries', Sync) {
    group = 'distribution'
    description = 'Synchronizes the AlpakkaWeaver installDist output used by Alpakka-JS.'
    dependsOn tasks.named('installDist')
    from alpakkaWeaverInstallDir
    into alpakkaJsJavaBinaries

    // The destination is also used by npm packaging and must not retain files
    // that are no longer part of installDist.
    outputs.upToDateWhen { false }

    doFirst {
        def installLib = alpakkaWeaverInstallDir.get().dir('lib').asFile
        if (!installLib.isDirectory()) {
            throw new GradleException("AlpakkaWeaver installDist output is missing: ${installLib}")
        }

        def destination = alpakkaJsJavaBinaries.asFile.toPath()
        if (java.nio.file.Files.isSymbolicLink(destination)) {
            java.nio.file.Files.delete(destination)
        } else if (java.nio.file.Files.exists(destination) && !java.nio.file.Files.isDirectory(destination)) {
            throw new GradleException("Alpakka-JS java-binaries is not a directory: ${destination}")
        }
    }
}

tasks.named('installDist') {
    finalizedBy syncAlpakkaJsJavaBinaries
}
